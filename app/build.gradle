plugins {
    id 'com.android.application'
}

android {
    namespace 'space.manus.ilmpath'
    compileSdk 34

    defaultConfig {
        applicationId 'space.manus.ilmpath'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
